name: Flyway migrations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate: every change must apply cleanly to an empty throwaway database first.
  migrate-from-scratch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ci_db"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrate a fresh database
        run: |
          docker run --rm --network host -v "${{ github.workspace }}/sql:/flyway/sql" flyway/flyway:10 \
            -url=jdbc:postgresql://localhost:5432/ci_db -user=admin -password=admin123 \
            -locations=filesystem:/flyway/sql -validateMigrationNaming=true migrate validate info

  # Only on main, only after the gate passes. Stops at the first failure,
  # so a bad migration never reaches test or prod.
  dev:
    if: github.ref == 'refs/heads/main'   # never deploy from a PR or another branch
    needs: migrate-from-scratch
    uses: ./.github/workflows/_deploy.yml
    with: { environment: dev }
    secrets: inherit

  test:
    needs: dev
    uses: ./.github/workflows/_deploy.yml
    with: { environment: test }
    secrets: inherit

  prod:
    needs: test
    uses: ./.github/workflows/_deploy.yml
    with: { environment: prod }
    secrets: inherit
