# Manual operations (Actions tab -> "Manual Flyway operations" -> Run workflow).
# These are the commands the normal pipeline deliberately never runs.
name: Manual Flyway operations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, test, prod]
        default: dev
      action:
        description: What to run
        type: choice
        options:
          - info
          - migrate
          - migrate-out-of-order
          - repair
          - baseline
          - load-legacy-schema
          - reset-schema
        default: info
      baseline_version:
        description: Version to baseline at (baseline only)
        default: "8"
      confirm:
        description: Type the environment name to confirm (reset-schema and repair only)
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      BASELINE_VERSION: ${{ inputs.baseline_version }}
      CONFIRM: ${{ inputs.confirm }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard rails
        run: |
          case "$ACTION" in
            reset-schema|load-legacy-schema)
              if [ "$ENVIRONMENT" = "prod" ]; then echo "$ACTION is not allowed on prod."; exit 1; fi ;;
          esac
          case "$ACTION" in
            reset-schema|repair)
              if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
                echo "Set 'confirm' to '$ENVIRONMENT' to run $ACTION."; exit 1
              fi ;;
          esac

      - name: Run
        run: |
          flyway() {
            docker run --rm -v "$GITHUB_WORKSPACE/sql:/flyway/sql" flyway/flyway:10 \
              -url="$DB_URL" -user="$DB_USER" -password="$DB_PASSWORD" \
              -locations=filesystem:/flyway/sql -schemas="$ENVIRONMENT" -validateMigrationNaming=true "$@"
          }
          case "$ACTION" in
            info)                 flyway info ;;
            migrate)              flyway migrate && flyway info ;;
            migrate-out-of-order) flyway -outOfOrder=true migrate && flyway info ;;
            repair)               flyway repair && flyway info ;;
            baseline)             flyway -baselineVersion="$BASELINE_VERSION" -baselineDescription="Legacy database" baseline && flyway info ;;
            reset-schema)         flyway -cleanDisabled=false clean && flyway info ;;
            load-legacy-schema)
              # Builds the hand-made, non-Flyway tables inside the chosen schema
              docker run --rm -i \
                -e PGUSER="$DB_USER" -e PGPASSWORD="$DB_PASSWORD" \
                -e PGOPTIONS="-c search_path=$ENVIRONMENT" \
                postgres:16 psql "${DB_URL#jdbc:}" -v ON_ERROR_STOP=1 < demo/legacy_schema.sql
              ;;
          esac
