services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h localhost forces TCP: the temporary init-time server only listens on the
      # unix socket, so this stays unhealthy until the init script has finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U admin -d postgres"]
      interval: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sql:/flyway/sql
      - ./conf:/flyway/conf

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sql:/sql:ro
    # Local sandbox by default. To read the Supabase schemas instead, put the values from
    # .env.example into a git-ignored .env file (PG_SCHEMAS=true, PGSSL=true, pooler host/user).
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-admin}
      PGPASSWORD: ${PGPASSWORD:-admin123}
      PGDATABASE: ${PGDATABASE:-postgres}
      PG_SCHEMAS: ${PG_SCHEMAS:-false}
      PGSSL: ${PGSSL:-false}


volumes:
  pgdata: